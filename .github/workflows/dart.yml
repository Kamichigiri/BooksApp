# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
  
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
  
    - name: Install dependencies
      working-directory: ./books_app
      run: flutter pub get
  
    - name: Analyze project source
      working-directory: ./books_app
      run: flutter analyze
  
    - name: Run tests
      working-directory: ./books_app
      run: flutter test
