allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module("com.github.NanoHttpd.nanohttpd:nanohttpd") using module("org.nanohttpd:nanohttpd:2.3.1")
            substitute module("com.github.NanoHttpd.nanohttpd:nanohttpd-nanolets") using module("org.nanohttpd:nanohttpd-nanolets:2.3.1")
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
